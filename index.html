<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap"
      rel="stylesheet"
    />
    <title>PopChoice</title>
  </head>
  <body class="bg-[#000C36]">
    <div class="flex flex-col justify-center">
      <img src="./images/popchoice-icon.png" />
      <h1 class="text-6xl font-[Carter_One] font-bold text-white">PopChoice</h1>
    </div>
    <div class="flex flex-col justify-center">
      <input
        id="peopleCount"
        aria-label="How many people?"
        type="number"
        min="1"
      />
      <input
        id="availableTime"
        aria-label="How much time do you have?"
        placeholder="e.g. 2 hours 30 minutes"
      />
      <button id="startButton">Start</button>
    </div>
    <div id="appContainer"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
